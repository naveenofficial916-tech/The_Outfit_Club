<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Royal Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA6" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A6414" />
      <stop offset="50%" stop-color="#F5D77F" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="120" height="120" rx="26" fill="#0A0A0C" />
  <circle cx="60" cy="60" r="50" fill="url(#goldGlow)" />
  <rect width="116" height="116" x="2" y="2" rx="24" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- 5-Point Royal Crown Crest -->
  <g filter="url(#subtleShadow)">
    <!-- Crown Base Band with jewels -->
    <path d="M38 41 C38 41, 60 38, 82 41 L80 46 C60 43, 40 43, 40 46 Z" fill="url(#goldGrad)" />
    <circle cx="48" cy="43.5" r="1.5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="60" cy="42" r="1.8" fill="#FFFFFF" />
    <circle cx="72" cy="43.5" r="1.5" fill="#FFFFFF" opacity="0.9" />

    <!-- Crown Peaks / Spikes -->
    <!-- Center Peak with Fleur-de-lis Cross -->
    <path d="M57 40 L60 21 L63 40 Z" fill="url(#goldLight)" />
    <circle cx="60" cy="19.5" r="2.5" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="0.8" />
    <path d="M58 20.5 L62 20.5 M60 18.5 L60 22.5" stroke="#FFFFFF" stroke-width="0.8" />

    <!-- Left Inner Peak -->
    <path d="M47 40 L48 27 L53 40 Z" fill="url(#goldGrad)" />
    <circle cx="48" cy="26" r="2" fill="url(#goldLight)" />

    <!-- Right Inner Peak -->
    <path d="M73 40 L72 27 L67 40 Z" fill="url(#goldGrad)" />
    <circle cx="72" cy="26" r="2" fill="url(#goldLight)" />

    <!-- Left Outer Peak -->
    <path d="M38 41 L36 31 L43 40 Z" fill="url(#goldGrad)" />
    <circle cx="36" cy="30" r="1.8" fill="url(#goldGrad)" />

    <!-- Right Outer Peak -->
    <path d="M82 41 L84 31 L77 40 Z" fill="url(#goldGrad)" />
    <circle cx="84" cy="30" r="1.8" fill="url(#goldGrad)" />

    <!-- Filigree Arches -->
    <path d="M38 41 Q 48 34, 60 38 Q 72 34, 82 41" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" />

    <!-- INTERLOCKING TOC MONOGRAM -->
    <!-- 'T' Bar and Stem -->
    <path d="M34 50 L86 50 L84 55 L65 55 L65 96 L55 96 L55 55 L36 55 Z" fill="url(#goldLight)" stroke="#0A0A0C" stroke-width="1" />
    <!-- T Foot serif -->
    <path d="M50 96 L70 96 L67 100 L53 100 Z" fill="url(#goldGrad)" />
    <!-- T Top serifs -->
    <path d="M34 50 L39 50 L34 57 Z M86 50 L81 50 L86 57 Z" fill="url(#goldGrad)" />

    <!-- 'O' Interlocking Oval Ring -->
    <ellipse cx="60" cy="74" rx="20" ry="22" fill="none" stroke="url(#goldGrad)" stroke-width="6.5" />
    <ellipse cx="60" cy="74" rx="20" ry="22" fill="none" stroke="url(#goldLight)" stroke-width="1.5" opacity="0.8" />

    <!-- 'C' Interlocking Sweeping Arc -->
    <path d="M74 61 C68 56, 50 56, 42 66 C34 76, 36 86, 46 92 C54 96, 68 96, 76 87" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <path d="M74 61 C68 56, 50 56, 42 66 C34 76, 36 86, 46 92 C54 96, 68 96, 76 87" fill="none" stroke="url(#goldLight)" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
    
    <!-- C Serifs -->
    <circle cx="74" cy="61" r="3" fill="url(#goldLight)" />
    <circle cx="76" cy="87" r="3" fill="url(#goldLight)" />
  </g>
</svg>